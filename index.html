<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The academic homepage of LiLan, a PhD student.">
  <meta name="color-scheme" content="light">
  <title>LiLan | Academic Homepage</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f9fafb;
      --heading: #17283a;
      --text: #374657;
      --accent: #205588;
      --rule: #d7dfe7;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 1.0625rem / 1.75 system-ui, sans-serif;
    }

    .page {
      width: min(calc(100% - 3rem), 58rem);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding-top: calc(clamp(3.5rem, 11vw, 8rem) + clamp(2rem, 5vw, 3.5rem));
      padding-bottom: 3rem;
      display: grid;
      grid-template-columns: minmax(10rem, 1fr) minmax(0, 2.45fr);
      align-content: start;
      gap: clamp(2rem, 6vw, 4rem);
    }

    .profile {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    h1, h2 {
      margin: 0;
      color: var(--heading);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.14;
    }

    h1 {
      font-size: clamp(2.4rem, 5vw, 3rem);
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.015em;
    }

    .role {
      margin: 0.6rem 0 1.25rem;
      font-size: 0.9375rem;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    main {
      min-width: 0;
      padding: 0.375rem 0 0.375rem clamp(1.5rem, 4vw, 3rem);
      border-left: 1px solid var(--rule);
    }

    main section + section {
      margin-top: 2rem;
    }

    main p {
      max-width: 55ch;
      margin: 0.8rem 0 0;
    }

    .artwork-footer {
      overflow: hidden;
      padding: clamp(0.75rem, 3vw, 2.5rem) 1rem clamp(2.5rem, 6vw, 5rem);
    }

    .artwork {
      width: min(100%, 54rem);
      width: min(100%, 54rem, 110svh);
      margin: 0 auto;
    }

    .artwork-image {
      position: relative;
      isolation: isolate;
    }

    .artwork-image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .artwork-blur {
      position: absolute;
      inset: 0;
      z-index: -1;
      filter: blur(clamp(12px, 2.4vw, 34px));
      transform: scale(1.04);
      opacity: 0.24;
      mask-image: radial-gradient(ellipse, #000 31%, transparent 72%);
    }

    .artwork-focus {
      mask-image:
        linear-gradient(to right, transparent, #000 17%, #000 83%, transparent),
        linear-gradient(to bottom, transparent, #000 15%, #000 83%, transparent);
      mask-composite: intersect;
    }

    .artwork-caption {
      margin-top: 0.65rem;
      color: var(--text);
      font-size: 0.875rem;
      text-align: center;
    }

    @media (max-width: 38rem) {
      .page {
        grid-template-columns: minmax(0, 1fr);
      }

      main {
        padding: 1.75rem 0 0;
        border-top: 1px solid var(--rule);
        border-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="profile">
      <h1>LiLan</h1>
      <p class="role">PhD Student</p>
      <a href="https://github.com/clearwho">GitHub</a>
    </header>

    <main>
      <section aria-labelledby="about">
        <h2 id="about">About</h2>
        <p>I am currently pursuing a PhD and will share updates here as my research develops.</p>
      </section>
    </main>
  </div>

  <footer class="artwork-footer">
    <figure class="artwork">
      <div class="artwork-image">
        <img
          class="artwork-blur"
          src="https://w.wallhaven.cc/full/m3/wallhaven-m38lo1.png"
          alt=""
          aria-hidden="true"
          width="3538"
          height="2560"
          loading="lazy"
          decoding="async"
          referrerpolicy="no-referrer"
        >
        <img
          class="artwork-focus"
          src="https://w.wallhaven.cc/full/m3/wallhaven-m38lo1.png"
          alt="A lone climber ascending a snowy slope"
          width="3538"
          height="2560"
          loading="lazy"
          decoding="async"
          referrerpolicy="no-referrer"
        >
      </div>
      <figcaption class="artwork-caption">
        <a href="https://www.whvn.cc/w/m38lo1"><cite>The Climber</cite></a> · Shin’ichi Sakamoto
      </figcaption>
    </figure>
  </footer>
</body>
</html>
